spring.application.name=huerto-api

# Puerto del microservicio (la app Android usa http://10.0.2.2:8080 desde el emulador)
server.port=8080

# Base de datos de XAMPP (MariaDB/MySQL). Se crea sola si no existe.
# XAMPP trae por defecto el usuario root sin contraseña.
spring.datasource.url=jdbc:mariadb://localhost:3306/huerto_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# Hibernate crea y actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
