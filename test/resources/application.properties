# Configuración SOLO para las pruebas: base H2 en memoria (no hace falta MySQL ni XAMPP).
spring.datasource.url=jdbc:h2:mem:gasvolcan_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
jwt.secret=clave-de-pruebas-para-los-tests-automaticos-0123456789
jwt.access-minutos=30
jwt.refresh-dias=7
